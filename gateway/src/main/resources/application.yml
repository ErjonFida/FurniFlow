server:
  port: 8090

spring:
  application:
    name: gateway
  http:
    clients:
      # A service that stops answering must not hold the gateway's threads, and with them the rest of the shop
      connect-timeout: 2s
      read-timeout: 30s
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog
              uri: ${furniflow.catalog-url}
              predicates:
                - Path=/api/catalog/**
            - id: inventory
              uri: ${furniflow.inventory-url}
              predicates:
                - Path=/api/inventory/**
            - id: orders
              uri: ${furniflow.order-url}
              predicates:
                - Path=/api/orders/**

# Kubernetes overrides these with FURNIFLOW_CATALOGURL and so on
furniflow:
  catalog-url: http://localhost:8091
  inventory-url: http://localhost:8092
  order-url: http://localhost:8093
