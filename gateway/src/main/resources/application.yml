server:
  port: 8090

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog
              uri: http://localhost:8091
              predicates:
                - Path=/api/catalog/**
            - id: inventory
              uri: http://localhost:8092
              predicates:
                - Path=/api/inventory/**
            - id: orders
              uri: http://localhost:8093
              predicates:
                - Path=/api/orders/**
