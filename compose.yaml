# Local databases, Kafka and Keycloak. Run the services from your IDE or with ./mvnw spring-boot:run.
services:
  inventory-db:
    image: postgres:18
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: furniflow
      POSTGRES_PASSWORD: furniflow
    ports: ["5441:5432"]
    volumes: [inventory-data:/var/lib/postgresql]

  order-db:
    image: postgres:18
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: furniflow
      POSTGRES_PASSWORD: furniflow
    ports: ["5442:5432"]
    volumes: [order-data:/var/lib/postgresql]

  catalog-db:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [catalog-data:/data/db]

  kafka:
    image: apache/kafka:4.2.2 # one broker in KRaft mode (no ZooKeeper), on localhost:9092
    ports: ["9092:9092"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin # admin console on http://localhost:8180/admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8180:8080"]
    volumes: [./keycloak:/opt/keycloak/data/import:ro]

volumes:
  inventory-data:
  order-data:
  catalog-data:
