server:
  port: 8092

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5441/inventory
    username: furniflow
    password: furniflow
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate 
  mvc:
    problemdetails:
      enabled: true
  kafka:
    consumer:
      group-id: inventory-service
      # A new consumer group starts from the oldest event, so nothing sent before it first joined is skipped
      auto-offset-reset: earliest
      properties:
        # order-service creates order-paid with 3 partitions. Started first, this consumer would create it with 1,
        # and then not read the 2 added later until its next metadata refresh (5 minutes).
        "[allow.auto.create.topics]": false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens must be signed by this realm. Its public keys are fetched from here on the first request.
          issuer-uri: http://localhost:8180/realms/furniflow
          # Keycloak lists realm roles under realm_access.roles; admin becomes ROLE_admin, for hasRole("admin")
          authorities-claim-expressions: "['realm_access']['roles']"
          authority-prefix: ROLE_
