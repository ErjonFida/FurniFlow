server:
  port: 8092

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5441/inventory
    username: furniflow
    password: furniflow
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate 
  mvc:
    problemdetails:
      enabled: true
  kafka:
    consumer:
      group-id: inventory-service
      # A new consumer group starts from the oldest event, so nothing sent before it first joined is skipped
      auto-offset-reset: earliest
