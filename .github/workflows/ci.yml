name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Testcontainers uses the runner's Docker for PostgreSQL, MongoDB and Kafka
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  # After main passes, publishes the images Kubernetes runs: ghcr.io/erjonfida/furniflow/<image>
  images:
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [gateway, catalog-service, inventory-service, order-service, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image == 'frontend' && 'frontend' || '.' }}
          build-args: SERVICE=${{ matrix.image }}
          push: true
          # latest for trying it out; the commit's SHA to deploy exactly this build
          tags: |
            ghcr.io/erjonfida/furniflow/${{ matrix.image }}:latest
            ghcr.io/erjonfida/furniflow/${{ matrix.image }}:${{ github.sha }}
