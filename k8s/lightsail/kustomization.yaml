# FurniFlow on one 4 GB server running k3s, such as an AWS Lightsail instance, over HTTPS. Steps in README.md.
# PUBLIC_HOST stands for the server's name (yourname.duckdns.org):
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/lightsail | sed "s/PUBLIC_HOST/yourname.duckdns.org/g" | kubectl apply -f -
resources:
  - ../infra.yaml
  - ../apps.yaml
  - lightsail.yaml # the HTTPS entrance and Keycloak's database
patches:
  - path: patches.yaml
  # The server has no memory for a second pod during an update, so the old one stops before the new one starts
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/strategy
        value: {type: Recreate, rollingUpdate: null} # null clears what a server deployed before this still holds
configMapGenerator:
  - name: keycloak-realm # as in ../../kustomization.yaml
    files: [../../keycloak/furniflow-realm.json]
  - name: frontend-keycloak
    files: [keycloak.json]
