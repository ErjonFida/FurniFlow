# Databases, Kafka and Keycloak for a local cluster. In the cloud these would be managed services.
apiVersion: v1
kind: Secret
metadata: {name: furniflow}
stringData:
  # Local-only values, the same as in compose.yaml and keycloak/furniflow-realm.json.
  # A real cluster gets this Secret from outside Git (kubectl create secret, or the cloud's secret store).
  db-password: furniflow
  order-service-client-secret: order-service-secret
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: inventory-db}
spec:
  serviceName: inventory-db
  selector: {matchLabels: {app: inventory-db}}
  template:
    metadata: {labels: {app: inventory-db}}
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - {name: POSTGRES_DB, value: inventory}
            - {name: POSTGRES_USER, value: furniflow}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: furniflow, key: db-password}}}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
  # Each database keeps its own disk, which survives pod restarts and redeploys
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: inventory-db}
spec: {selector: {app: inventory-db}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: order-db}
spec:
  serviceName: order-db
  selector: {matchLabels: {app: order-db}}
  template:
    metadata: {labels: {app: order-db}}
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - {name: POSTGRES_DB, value: orders}
            - {name: POSTGRES_USER, value: furniflow}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: furniflow, key: db-password}}}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: order-db}
spec: {selector: {app: order-db}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: catalog-db}
spec:
  serviceName: catalog-db
  selector: {matchLabels: {app: catalog-db}}
  template:
    metadata: {labels: {app: catalog-db}}
    spec:
      containers:
        - name: mongo
          image: mongo:9.0
          ports: [{containerPort: 27017}]
          volumeMounts: [{name: data, mountPath: /data/db}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: catalog-db}
spec: {selector: {app: catalog-db}, ports: [{port: 27017}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka}
spec:
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      # Kubernetes would otherwise add KAFKA_PORT, KAFKA_SERVICE_HOST and so on for the kafka Service,
      # and this image turns every KAFKA_* variable into broker config
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:4.2.2
          env: # one broker in KRaft mode, as in compose.yaml, but reachable as kafka:9092
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
          ports: [{containerPort: 9092}]
---
apiVersion: v1
kind: Service
metadata: {name: kafka}
spec: {selector: {app: kafka}, ports: [{port: 9092}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: keycloak}
spec:
  selector: {matchLabels: {app: keycloak}}
  template:
    metadata: {labels: {app: keycloak}}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1
          # Dev mode keeps its database in the pod, so the realm is imported again on every start
          args: [start-dev, --import-realm]
          env:
            # The issuer in every token, whether the browser (localhost:8180) or a service (keycloak:8180) asked for it
            - {name: KC_HOSTNAME, value: "http://localhost:8180"}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin}
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}]
      volumes: [{name: realm, configMap: {name: keycloak-realm}}]
---
apiVersion: v1
kind: Service
metadata: {name: keycloak}
spec:
  type: LoadBalancer # Docker Desktop publishes it on localhost:8180, where the browser signs in
  selector: {app: keycloak}
  ports: [{port: 8180, targetPort: 8080}]
