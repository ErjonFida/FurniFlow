<nav class="navbar navbar-expand bg-body-tertiary border-bottom">
  <div class="container">
    <a class="navbar-brand" routerLink="/">FurniFlow</a>
    @if (keycloak.authenticated) {
      <div class="d-flex align-items-center gap-3">
        @if (keycloak.hasRealmRole('customer')) {
          <a class="nav-link" routerLink="/orders">My orders</a>
        }
        @if (keycloak.hasRealmRole('admin')) {
          <a class="nav-link" routerLink="/admin">Admin</a>
        }
        <span class="navbar-text">{{ keycloak.tokenParsed?.['preferred_username'] }}</span>
        <button class="btn btn-outline-secondary btn-sm" type="button" (click)="signOut()">Sign out</button>
      </div>
    } @else {
      <button class="btn btn-primary btn-sm" type="button" (click)="keycloak.login()">Sign in</button>
    }
  </div>
</nav>

<main class="container py-4">
  <router-outlet />
</main>
