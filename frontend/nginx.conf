server {
    listen 8080;
    root /usr/share/nginx/html;

    # nginx compresses only HTML unless told otherwise
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Pages such as /orders are Angular routes, not files: answer them with the app
    location / {
        try_files $uri $uri/ /index.html;
        # Checked on every visit, so a release shows at once and an old index.html never asks for scripts that are gone
        add_header Cache-Control "no-cache";
    }

    # File names carry a hash of their content, so these can be kept for good. Quoted, or nginx reads { as a block.
    location ~ "-[\w-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://gateway:8090;
    }
}
