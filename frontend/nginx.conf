server {
    listen 8080;
    root /usr/share/nginx/html;

    # nginx compresses only HTML unless told otherwise; JSON covers the catalog and orders coming back from /api
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Pages such as /orders are Angular routes, not files: answer them with the app
    location / {
        try_files $uri $uri/ /index.html;
        # Checked again on every visit, so a new release shows at once. Kept heuristically, an old index.html would ask
        # for scripts that the release removed.
        add_header Cache-Control "no-cache";
    }

    # The build names scripts and styles after a hash of their content (main-RP7OCNK4.js), so a changed file is a new
    # address and these can be kept for good. Quoted, or nginx reads the { as the start of a block.
    location ~ "-[\w-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://gateway:8090;
    }
}
